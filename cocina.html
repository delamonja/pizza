<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina | De La Monja</title>
    <style>
        :root { --bg: #111; --red: #ff0013; --green: #00C851; --text: #fff; --gold: #eec996; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .admin-logo { display: block; margin: 0 auto 10px; max-width: 120px; filter: drop-shadow(0 0 10px rgba(255, 0, 19, 0.4)); }
        h1 { text-align: center; color: var(--gold); margin-top: 5px; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;}
        h2 { text-align: center; color: #ccc; margin-top: 40px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 1.2rem;}
        
        .audio-toggle { padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; }
        .audio-off { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(238, 201, 150, 0.3); }
        .audio-on { background: rgba(0, 200, 81, 0.1); color: var(--green); border-color: var(--green); }

        .shop-switch { background: #333; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 30px; border: 2px solid #555; cursor: pointer; transition: 0.3s; }
        .shop-switch.open { background: rgba(0, 200, 81, 0.2); border-color: var(--green); }
        .shop-switch.closed { background: rgba(255, 68, 68, 0.2); border-color: var(--red); }
        .status-text { font-size: 2rem; font-weight: bold; display: block; margin-bottom: 5px; }
        
        .control-list { display: grid; gap: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .item-name { font-size: 1.1rem; }
        .toggle-btn { padding: 8px 15px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
        .toggle-btn.on { background: var(--green); color: white; }
        .toggle-btn.off { background: var(--red); color: white; opacity: 0.6; }
        .delete-btn { background: transparent; border: 1px solid #555; color: #ff4444; margin-left: 10px; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
        
        .order-card { background: #222; padding: 15px; border-radius: 12px; border: 1px solid #444; margin-bottom: 10px; position: relative; }
        .order-listo { border-left: 4px solid #1ed760; opacity: 0.85; }
        .status.listo { color: #1ed760; font-weight: 700; }
        
        /* NEW STYLES FOR KITCHEN AID */
        .order-total { color: var(--gold); font-size: 1.3rem; font-weight: bold; display: block; margin: 4px 0; }
        .delivery-badge { background: #444; color: #fff; padding: 4px 10px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .badge-pickup { background: #333; }
        .badge-brewery { background: #d4a017; color: #000; }
        .badge-barra27 { background: #6a0dad; }
        .badge-manda2 { background: #ff4444; }

        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .actions button { padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; }
        .btn-done { background: linear-gradient(135deg, #1db954, #1ed760); color: #111; }
        .btn-delete { background: transparent; color: #ff6b6b; border: 1px solid rgba(255, 107, 107, 0.4); }
        .pizza-block { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; margin-top: 5px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1); }
        .pizza-size-label { color: var(--gold); font-weight: bold; margin-left: 5px; }
        
        .add-special-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .special-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 1rem; }
        .add-btn { background: var(--gold); color: black; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="audio-toggle-btn" class="audio-toggle audio-off" onclick="toggleAudioSystem()">
        🔊 ENCENDER AUDIO DE COCINA
    </div>
    
    <img src="logopizza.png" alt="De La Monja" class="admin-logo">
    <h1>👨‍🍳 CONTROL DE COCINA</h1>
    
    <div id="shop-status-btn" class="shop-switch" onclick="toggleShop()">
        <span class="status-text" id="status-label">Conectando...</span>
        <span style="font-size:0.9rem; color:#ccc;">(Click para cambiar estado)</span>
    </div>

    <h2>📋 Pedidos</h2>
    <div class="control-list" id="orders-list"></div>

    <h2 style="color:var(--gold);">✨ Especiales (Temporada)</h2>
    <div class="add-special-box">
        <input type="text" id="new-special-name" class="special-input" placeholder="Ej: Higos, Queso Azul...">
        <button class="add-btn" onclick="addNewSpecial()">AGREGAR</button>
    </div>
    <div class="control-list" id="special-list"></div>

    <h2>🍕 Ingredientes Base</h2>
    <div class="control-list" id="ing-list"></div>
    
    <h2>🌶️ Aderezos</h2>
    <div class="control-list" id="dressing-list"></div>

    <audio id="order-sound" preload="auto">
        <source src="order.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPZtmiXYBG33qOopqQTuK2yQjhPIs-nyU",
            authDomain: "delamonjapizza.firebaseapp.com",
            databaseURL: "https://delamonjapizza-default-rtdb.firebaseio.com",
            projectId: "delamonjapizza",
            storageBucket: "delamonjapizza.firebasestorage.app",
            messagingSenderId: "591665050822",
            appId: "1:591665050822:web:7358f238adc6dbe05213c7",
            measurementId: "G-LG2P62XW75"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let isShopOpen = false;
        let knownOrders = new Set();
        let firstLoad = true;
        let audioEnabled = false;
        const orderSound = document.getElementById("order-sound");

        window.toggleAudioSystem = () => {
            const btn = document.getElementById('audio-toggle-btn');
            if (!audioEnabled) {
                orderSound.play().then(() => {
                    audioEnabled = true;
                    btn.className = "audio-toggle audio-on";
                    btn.innerText = "✅ AUDIO ACTIVADO (Click para apagar)";
                }).catch(e => alert("Interacción requerida: Haz click de nuevo."));
            } else {
                audioEnabled = false;
                btn.className = "audio-toggle audio-off";
                btn.innerText = "🔊 ENCENDER AUDIO DE COCINA";
            }
        };

        window.toggleShop = () => set(ref(db, 'shopStatus'), !isShopOpen);

        onValue(ref(db, 'shopStatus'), (snap) => {
            isShopOpen = snap.val();
            const btn = document.getElementById('shop-status-btn');
            const label = document.getElementById('status-label');
            if (btn) btn.className = isShopOpen ? "shop-switch open" : "shop-switch closed";
            if (label) label.innerText = isShopOpen ? "🟢 ABIERTO" : "🔴 CERRADO";
        });

        onValue(ref(db, "orders"), (snap) => {
            const data = snap.val();
            if (!data) { knownOrders.clear(); renderOrders(null); return; }
            const currentIds = Object.keys(data);
            let newOrderFound = false;
            currentIds.forEach(id => {
                if (!knownOrders.has(id)) {
                    knownOrders.add(id);
                    if (!firstLoad) newOrderFound = true;
                }
            });
            if (newOrderFound && audioEnabled) { orderSound.currentTime = 0; orderSound.play().catch(e => console.error(e)); }
            firstLoad = false;
            renderOrders(data);
        });

        function renderOrders(data) {
            const wrap = document.getElementById("orders-list");
            wrap.innerHTML = "";
            if (!data) { wrap.innerHTML = "<div style='text-align:center; padding:20px; color:#555;'>No hay pedidos pendientes</div>"; return; }
            
            Object.entries(data).sort((a, b) => b[1].time - a[1].time).forEach(([id, order]) => {
                const card = document.createElement("div");
                card.className = `order-card ${order.status === 'listo' ? 'order-listo' : ''}`;
                
                // Pizza Block updated with Size
                let pizzasHTML = (order.pizzas || []).map((p, i) => `
                    <div class="pizza-block">
                        <div style="display:flex; justify-content:space-between;">
                            <strong>🍕 Pizza ${i + 1}</strong>
                            <span class="pizza-size-label">${p.size === 'Grande' ? 'GRANDE' : 'MEDIANA'}</span>
                        </div>
                        <div style="margin-top:4px;">
                            Ing: ${(p.ingredients || []).slice(0,2).join(", ") || "Solo Queso"}<br>
                            Ext: ${(p.ingredients || []).slice(2).join(", ") || "—"}<br>
                            Ade: ${(p.dressings || []).join(", ") || "—"}
                        </div>
                    </div>
                `).join("");

                // Delivery badge logic
                let deliveryLabel = "";
                let deliveryClass = "";
                switch(order.delivery) {
                    case 'pickup': deliveryLabel = "🥡 RECOGER"; deliveryClass = "badge-pickup"; break;
                    case 'brewery': deliveryLabel = "🍺 BORREGA"; deliveryClass = "badge-brewery"; break;
                    case 'barra27': deliveryLabel = "🍸 BARRA 27"; deliveryClass = "badge-barra27"; break;
                    case 'manda2': deliveryLabel = "🛵 MANDA2"; deliveryClass = "badge-manda2"; break;
                    default: deliveryLabel = "🥡 TIENDA"; deliveryClass = "badge-pickup";
                }

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <strong style="font-size:1.2rem; display:block;">${order.name}</strong>
                            <span class="order-total">$${order.total || 0}</span>
                        </div>
                        <span class="delivery-badge ${deliveryClass}">${deliveryLabel}</span>
                    </div>
                    
                    ${order.notes ? `<div style="color:var(--gold); font-size:0.9rem; margin:10px 0; background:rgba(238,201,150,0.1); padding:8px; border-radius:5px;">📝 ${order.notes}</div>` : ""}
                    
                    ${pizzasHTML}
                    
                    <div class="actions">
                        <button class="btn-done" onclick="completeOrder('${id}')">${order.status === 'listo' ? 'RE-ABRIR' : 'MARCAR LISTO'}</button>
                        <button class="btn-delete" onclick="deleteOrder('${id}')">BORRAR</button>
                    </div>
                `;
                wrap.appendChild(card);
            });
        }

        window.addNewSpecial = () => {
            const input = document.getElementById('new-special-name');
            if(input.value.trim()) { set(ref(db, 'specials/' + input.value.trim()), true); input.value = ''; }
        };

        window.deleteSpecial = (name) => { if(confirm(`¿Eliminar ${name}?`)) remove(ref(db, 'specials/' + name)); };

        window.completeOrder = (id) => {
            const r = ref(db, `orders/${id}`);
            get(r).then(s => update(r, { status: s.val().status === "listo" ? "pending" : "listo" }));
        };

        window.deleteOrder = (id) => { if(confirm("¿Seguro que deseas eliminar este pedido?")) remove(ref(db, `orders/${id}`)); };

        window.toggleItem = (node, name, current) => update(ref(db, node), { [name]: !current });

        function renderStandard(data, elId, node) {
            const list = document.getElementById(elId);
            list.innerHTML = '';
            if(!data) return;
            Object.keys(data).sort().forEach(name => {
                const ok = data[name];
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `<span>${name}</span><button class="toggle-btn ${ok?'on':'off'}" onclick="toggleItem('${node}','${name}',${ok})">${ok?'SI':'NO'}</button>`;
                list.appendChild(div);
            });
        }

        onValue(ref(db, 'ingredients'), s => renderStandard(s.val(), 'ing-list', 'ingredients'));
        onValue(ref(db, 'dressings'), s => renderStandard(s.val(), 'dressing-list', 'dressings'));
        onValue(ref(db, 'specials'), s => {
            const list = document.getElementById('special-list');
            list.innerHTML = '';
            if(s.val()) Object.keys(s.val()).forEach(n => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `<span style="color:var(--gold)">★ ${n}</span><button class="delete-btn" onclick="deleteSpecial('${n}')">🗑️</button>`;
                list.appendChild(div);
            });
        });
    </script>
</body>
</html>
