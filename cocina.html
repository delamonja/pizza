<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina | De La Monja</title>
    <style>
        :root { --bg: #111; --red: #ff0013; --green: #00C851; --text: #fff; --gold: #eec996; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .admin-logo { display: block; margin: 0 auto 10px; max-width: 120px; filter: drop-shadow(0 0 10px rgba(255, 0, 19, 0.4)); }
        h1 { text-align: center; color: var(--gold); margin-top: 5px; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;}
        h2 { text-align: center; color: #ccc; margin-top: 40px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 1.2rem;}
        
        .shop-switch { background: #333; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 30px; border: 2px solid #555; cursor: pointer; transition: 0.3s; }
        .shop-switch.open { background: rgba(0, 200, 81, 0.2); border-color: var(--green); }
        .shop-switch.closed { background: rgba(255, 68, 68, 0.2); border-color: var(--red); }
        .status-text { font-size: 2rem; font-weight: bold; display: block; margin-bottom: 5px; }

        .control-list { display: grid; gap: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .item-name { font-size: 1.1rem; }
        
        .toggle-btn { padding: 8px 15px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
        .toggle-btn.on { background: var(--green); color: white; }
        .toggle-btn.off { background: var(--red); color: white; opacity: 0.6; }
        .delete-btn { background: transparent; border: 1px solid #555; color: #ff4444; margin-left: 10px; padding: 8px 12px; border-radius: 10px; cursor: pointer; }

        /* INPUT AREA FOR SPECIALS */
        .add-special-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .special-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 1rem; }
        .add-btn { background: var(--gold); color: black; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

.order-listo {
  border-left: 4px solid #3bd16f;
  background: linear-gradient(
    90deg,
    rgba(59, 209, 111, 0.08),
    rgba(0, 0, 0, 0)
  );
}

.status.listo {
  color: #3bd16f;
  font-weight: 600;
}
.actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.actions button {
  padding: 6px 14px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.5px;
  cursor: pointer;
  border: none;
  transition: all 0.15s ease;
}

/* MARCAR LISTO */
.btn-done {
  background: linear-gradient(135deg, #1db954, #1ed760);
  color: #111;
}

.btn-done:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(30, 215, 96, 0.35);
}

/* ELIMINAR */
.btn-delete {
  background: transparent;
  color: #ff6b6b;
  border: 1px solid rgba(255, 107, 107, 0.4);
}

.btn-delete:hover {
  background: rgba(255, 107, 107, 0.15);
}

/* VISUAL STATE WHEN LISTO */
.order-listo {
  border-left: 4px solid #1ed760;
  opacity: 0.85;
}

.order-listo .status {
  color: #1ed760;
  font-weight: 700;
}

.sound-btn {
  background: #1f1f1f;
  color: #eee;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 12px;
}

.sound-btn.off {
  opacity: 0.5;
}


    </style>
</head>
<body>
    <img src="logopizza.png" alt="De La Monja" class="admin-logo">
    <h1>👨‍🍳 CONTROL DE COCINA</h1>
    
    <div id="shop-status-btn" class="shop-switch" onclick="toggleShop()">
        <span class="status-text" id="status-label">Conectando...</span>
        <span style="font-size:0.9rem; color:#ccc;">(Clic para cambiar estado)</span>
    </div>
<h2>📋 Pedidos</h2>
<button id="sound-toggle" class="sound-btn">
  🔔 Sonido: ON
</button>

<div class="control-list" id="orders-list"></div>

    <h2 style="color:var(--gold);">✨ Especiales (Temporada)</h2>
    <div class="add-special-box">
        <input type="text" id="new-special-name" class="special-input" placeholder="Ej: Higos, Queso Azul...">
        <button class="add-btn" onclick="addNewSpecial()">AGREGAR</button>
    </div>
    <div class="control-list" id="special-list"></div>

    <h2>🍕 Ingredientes Base</h2>
    <div class="control-list" id="ing-list"></div>
    
    <h2>🌶️ Aderezos</h2>
    <div class="control-list" id="dressing-list"></div>
<audio id="order-sound" preload="auto">
  <source src="order.mp3" type="audio/mpeg">
</audio>

<script type="module">
/* =========================
   🔊 AUDIO (GLOBAL SCOPE)
========================= */
const orderSound = new Audio("order.mp3");
orderSound.preload = "auto";

let soundEnabled = false;
let audioUnlocked = false;

/* =========================
   🔥 FIREBASE
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, get } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPZtmiXYBG33qOopqQTuK2yQjhPIs-nyU",
  authDomain: "delamonjapizza.firebaseapp.com",
  databaseURL: "https://delamonjapizza-default-rtdb.firebaseio.com",
  projectId: "delamonjapizza",
  storageBucket: "delamonjapizza.appspot.com",
  messagingSenderId: "591665050822",
  appId: "1:591665050822:web:7358f238adc6dbe05213c7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ordersRef = ref(db, "orders");
const statusRef = ref(db, "shopStatus");

let knownOrders = new Set();
let isShopOpen = false;

/* =========================
   🧠 HELPERS
========================= */
function formatOrderTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
}

/* =========================
   🔔 SOUND TOGGLE BUTTON
========================= */
const soundBtn = document.getElementById("sound-toggle");

soundBtn.addEventListener("click", async () => {
  try {
    if (!audioUnlocked) {
      orderSound.volume = 0;
      await orderSound.play();
      orderSound.pause();
      orderSound.currentTime = 0;
      orderSound.volume = 1;
      audioUnlocked = true;
      console.log("🔓 Audio unlocked");
    }

    soundEnabled = !soundEnabled;
    soundBtn.innerHTML = soundEnabled
      ? "🔔 Sonido: ON"
      : "🔕 Sonido: OFF";

    soundBtn.classList.toggle("off", !soundEnabled);

    // 🔊 test sound
    if (soundEnabled) {
      orderSound.currentTime = 0;
      orderSound.play();
    }

  } catch (err) {
    console.warn("Audio error:", err);
  }
});

/* =========================
   🏪 SHOP STATUS
========================= */
onValue(statusRef, snap => {
  isShopOpen = snap.val();
  const btn = document.getElementById("shop-status-btn");
  const label = document.getElementById("status-label");

  if (isShopOpen) {
    btn.className = "shop-switch open";
    label.textContent = "🟢 ABIERTO";
  } else {
    btn.className = "shop-switch closed";
    label.textContent = "🔴 CERRADO";
  }
});

window.toggleShop = () => set(statusRef, !isShopOpen);

/* =========================
   📦 ORDERS LISTENER
========================= */
onValue(ordersRef, snapshot => {
  const wrap = document.getElementById("orders-list");
  wrap.innerHTML = "";

  const data = snapshot.val();
  console.log("📦 orders snapshot:", data);

  if (!data) {
    knownOrders.clear();
    wrap.innerHTML = "<div class='empty'>No hay pedidos</div>";
    return;
  }

  const currentIds = Object.keys(data);

  // 🔔 play sound on NEW order
  currentIds.forEach(id => {
    if (!knownOrders.has(id) && soundEnabled && audioUnlocked) {
      orderSound.currentTime = 0;
      orderSound.play().catch(() => {});
    }
  });

  knownOrders = new Set(currentIds);
  renderOrders(data);
});

/* =========================
   🧱 RENDER ORDERS
========================= */
function renderOrders(data) {
  const wrap = document.getElementById("orders-list");
  wrap.innerHTML = "";

  Object.entries(data)
    .sort((a, b) => b[1].time - a[1].time)
    .forEach(([id, order]) => {
      const card = document.createElement("div");
      card.className = "order-card";
      card.classList.toggle("order-listo", order.status === "listo");

      let pizzasHTML = "";
      (order.pizzas || []).forEach((p, i) => {
        pizzasHTML += `
          <div class="pizza-block">
            <strong>🍕 Pizza ${i + 1}</strong><br>
            Ingredientes: ${(p.ingredients || []).join(", ") || "—"}<br>
            Extras: ${(p.ingredients || []).slice(2).join(", ") || "—"}<br>
            Aderezos: ${(p.dressings || []).join(", ") || "—"}
          </div>`;
      });

      card.innerHTML = `
        <div class="order-header">
          <strong>${order.name}</strong>
          <span class="status ${order.status}">${order.status}</span>
          <span class="order-time">⏱️ ${formatOrderTime(order.time)}</span>
        </div>

        ${order.notes ? `<div class="notes">📝 ${order.notes}</div>` : ""}

        <div class="pizzas">${pizzasHTML}</div>

        <div class="order-footer">
          <span class="total">$${order.total}</span>
          <div class="actions">
            <button class="btn-done" onclick="completeOrder('${id}')">MARCAR LISTO</button>
            <button class="btn-delete" onclick="deleteOrder('${id}')">ELIMINAR</button>
          </div>
        </div>
      `;

      wrap.appendChild(card);
    });
}

/* =========================
   ✅ ACTIONS
========================= */
window.completeOrder = async (id) => {
  const refOrder = ref(db, `orders/${id}`);
  const snap = await get(refOrder);
  if (!snap.exists()) return;

  const next = snap.val().status === "listo" ? "pending" : "listo";
  update(refOrder, { status: next });
};

window.deleteOrder = (id) => {
  if (confirm("¿Eliminar pedido?")) {
    remove(ref(db, `orders/${id}`));
  }
};
</script>

</body>
</html>
