<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina | De La Monja</title>
    <style>
        :root { --bg: #111; --red: #ff4444; --green: #00C851; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1, h2 { text-align: center; color: #eec996; }
        
        /* SWITCH GIGANTE */
        .shop-switch {
            background: #333; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 30px; border: 2px solid #555; cursor: pointer; transition: 0.3s;
        }
        .shop-switch.open { background: rgba(0, 200, 81, 0.2); border-color: var(--green); }
        .shop-switch.closed { background: rgba(255, 68, 68, 0.2); border-color: var(--red); }
        .status-text { font-size: 2rem; font-weight: bold; display: block; margin-bottom: 5px; }

        /* LISTA */
        .ing-control-list { display: grid; gap: 10px; }
        .ing-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444;
        }
        .ing-name { font-size: 1.1rem; }
        
        .toggle-btn {
            padding: 8px 15px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer;
        }
        .toggle-btn.on { background: var(--green); color: white; }
        .toggle-btn.off { background: var(--red); color: white; opacity: 0.6; }
    </style>
</head>
<body>

    <h1>👨‍🍳 CONTROL DE COCINA</h1>

    <div id="shop-status-btn" class="shop-switch" onclick="toggleShop()">
        <span class="status-text" id="status-label">Conectando...</span>
        <span style="font-size:0.9rem; color:#ccc;">(Clic para cambiar estado)</span>
    </div>

    <h2>Inventario de Ingredientes</h2>
    <div class="ing-control-list" id="ing-list"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // TUS CREDENCIALES REALES (Extraídas de tus imágenes)
        const firebaseConfig = {
            apiKey: "AIzaSyCPZtmiXYBG33qOopqQTuK2yQjhPIs-nyU",
            authDomain: "delamonjapizza.firebaseapp.com",
            databaseURL: "https://delamonjapizza-default-rtdb.firebaseio.com",
            projectId: "delamonjapizza",
            storageBucket: "delamonjapizza.firebasestorage.app",
            messagingSenderId: "591665050822",
            appId: "1:591665050822:web:7358f238adc6dbe05213c7",
            measurementId: "G-LG2P62XW75"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Lista Maestra para inicializar la BD la primera vez
        const masterIngredients = [
            "Jamón de Pavo", "Peperoni", "Salami", "Tocino", "Salchicha Frankfurt",
            "Aceituna negra", "Champiñones", "Jitomate cherry", "Cebolla morada",
            "Pimientos encurtidos", "Compota de cebolla", "Arúgula", "Queso de cabra"
        ];

        const statusRef = ref(db, 'shopStatus');
        const ingredientsRef = ref(db, 'ingredients');

        let isShopOpen = false;

        onValue(statusRef, (snapshot) => {
            isShopOpen = snapshot.val();
            renderShopStatus();
        });

        window.toggleShop = () => {
            set(statusRef, !isShopOpen);
        };

        function renderShopStatus() {
            const btn = document.getElementById('shop-status-btn');
            const label = document.getElementById('status-label');
            if (isShopOpen) {
                btn.className = "shop-switch open";
                label.innerText = "🟢 ABIERTO";
            } else {
                btn.className = "shop-switch closed";
                label.innerText = "🔴 CERRADO";
            }
        }

        onValue(ingredientsRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                // Si la base de datos está vacía, la llenamos automáticamente
                const initialData = {};
                masterIngredients.forEach(ing => initialData[ing] = true);
                set(ingredientsRef, initialData);
            } else {
                renderIngredients(data);
            }
        });

        function renderIngredients(data) {
            const list = document.getElementById('ing-list');
            list.innerHTML = ''; 
            Object.keys(data).sort().forEach(ingName => {
                const isAvailable = data[ingName];
                const div = document.createElement('div');
                div.className = 'ing-row';
                div.innerHTML = `
                    <span class="ing-name" style="opacity: ${isAvailable ? 1 : 0.4}">${ingName}</span>
                    <button class="toggle-btn ${isAvailable ? 'on' : 'off'}" onclick="toggleIng('${ingName}', ${isAvailable})">
                        ${isAvailable ? 'DISPONIBLE' : 'AGOTADO'}
                    </button>
                `;
                list.appendChild(div);
            });
        }

        window.toggleIng = (name, currentState) => {
            update(ref(db, 'ingredients'), { [name]: !currentState });
        };
    </script>
</body>
</html>
