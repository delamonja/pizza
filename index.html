<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>De La Monja | Pizza a la Leña</title>

<style>
:root{
 --bg-dark:#0f0f0f; --brand-red:#ff0013; --gold:#eec996; --text-white:#fff;
}
body.no-scroll{overflow:hidden;position:fixed;width:100%;height:100%}
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:var(--bg-dark);color:#fff;padding-bottom:120px}

.intro-screen{position:fixed;inset:0;z-index:5000;background:#000;transition:.8s}
.intro-screen.hidden{transform:translateY(-100%);pointer-events:none}
.intro-bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;animation:pulse 25s infinite alternate}
.intro-overlay-layer{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.95))}
.intro-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.intro-logo{max-width:240px;width:60%;margin-bottom:20px;filter:drop-shadow(0 0 25px #ff0013)}
.intro-btn{border:2px solid var(--brand-red);color:var(--brand-red);background:transparent;padding:15px 45px;border-radius:50px;font-weight:bold;cursor:pointer}
.intro-btn:hover{background:var(--brand-red);color:#fff}

.closed-banner{position:fixed;top:0;left:0;width:100%;background:#8E0E00;color:#fff;padding:15px;font-weight:bold;transform:translateY(-100%);transition:.3s;z-index:1000}
.closed-banner.visible{transform:translateY(0)}

.hero-section{height:40vh;min-height:320px;position:relative}
.oven-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
.logo-img{position:relative;z-index:1;max-width:160px;margin:20px auto;display:block}

.container{max-width:800px;margin:auto;padding:0 15px}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ing-card{border:1px solid #333;padding:12px;border-radius:10px;cursor:pointer}
.ing-card.selected{border-color:var(--brand-red);background:rgba(255,0,19,.15)}
.ing-card.disabled{opacity:.4;pointer-events:none}

.fab{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#25D366;color:#fff;padding:14px 25px;border-radius:50px;font-weight:bold;cursor:pointer}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-content{background:#111;border:1px solid var(--gold);border-radius:20px;padding:2rem;width:90%;max-width:400px}
.name-input{width:100%;padding:12px;margin-bottom:1rem;background:#000;border:1px solid #444;color:#fff}
.btn{padding:12px;border-radius:50px;font-weight:bold;cursor:pointer}
.btn-confirm{background:var(--brand-red);color:#fff}
.btn-cancel{background:transparent;border:1px solid #555;color:#ccc}

@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
</style>
</head>

<body class="no-scroll">

<div id="intro-screen" class="intro-screen">
 <div class="intro-bg-layer" style="background-image:url('leniaa.jpg')"></div>
 <div class="intro-overlay-layer"></div>
 <div class="intro-content">
  <img src="logopizza.png" class="intro-logo">
  <p>Pizza a la leña · Masa madre · Tapalpa</p>
  <button class="intro-btn" onclick="enterSite()">Ordenar Ahora</button>
 </div>
</div>

<div id="closed-banner" class="closed-banner">🚫 EL HORNO ESTÁ APAGADO</div>

<div class="hero-section">
 <img src="oven.jpg" class="oven-bg">
 <img src="logopizza.png" class="logo-img">
</div>

<div class="container">
 <h2>Elige Ingredientes</h2>
 <div id="ingredients-list" class="ing-grid"></div>

 <h2>Aderezos</h2>
 <div id="dressings-list" class="ing-grid"></div>

 <h2>Total</h2>
 <div id="total-display">$160</div>
</div>

<div class="fab" onclick="handleMainAction()">Revisar y Pedir</div>

<div id="review-modal" class="modal-overlay">
 <div class="modal-content">
  <h3>Tu Pedido</h3>
  <input id="customer-name" class="name-input" placeholder="Tu nombre">
  <textarea id="special-notes" class="name-input" rows="3"
   placeholder="Indicaciones especiales (sin sal, bien dorada, alergias…)"></textarea>
  <button class="btn btn-confirm" onclick="finalizeOrder()">Enviar a Cocina</button>
  <button class="btn btn-cancel" onclick="closeReviewModal()">Volver</button>
 </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,onValue,push,set}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app=initializeApp({
 apiKey:"AIzaSyCPZtmiXYBG33qOopqQTuK2yQjhPIs-nyU",
 authDomain:"delamonjapizza.firebaseapp.com",
 databaseURL:"https://delamonjapizza-default-rtdb.firebaseio.com",
 projectId:"delamonjapizza"
});
const db=getDatabase(app);

const BASE=160,EXTRA=10,PHONE="523411224987";
let open=false;
let pizza={ingredients:[],dressings:[]};

const statusRef=ref(db,"shopStatus");
const ingRef=ref(db,"ingredients");
const dressRef=ref(db,"dressings");
const ordersRef=ref(db,"orders");

onValue(statusRef,s=>{
 open=!!s.val();
 document.getElementById("closed-banner").classList.toggle("visible",!open);
});

onValue(ingRef,s=>render(s.val(),"ingredients-list",true));
onValue(dressRef,s=>render(s.val(),"dressings-list",false));

function render(data,id,isIng){
 const g=document.getElementById(id);g.innerHTML="";
 if(!data)return;
 Object.entries(data).forEach(([n,o])=>{
  if(!o.visible)return;
  const d=document.createElement("div");
  d.className="ing-card"+(!o.available?" disabled":"");
  d.onclick=()=>toggle(n,isIng);
  d.innerText=n;
  g.appendChild(d);
 });
 updateUI();
}

function toggle(n,isIng){
 const a=isIng?pizza.ingredients:pizza.dressings;
 a.includes(n)?a.splice(a.indexOf(n),1):a.push(n);
 updateUI();
}

function updateUI(){
 document.querySelectorAll(".ing-card").forEach(c=>{
  const n=c.innerText;
  c.classList.toggle("selected",pizza.ingredients.includes(n)||pizza.dressings.includes(n));
 });
 const extra=Math.max(0,pizza.ingredients.length-2)*EXTRA;
 document.getElementById("total-display").innerText="$"+(BASE+extra);
}

window.enterSite=()=>{
 document.getElementById("intro-screen").classList.add("hidden");
 document.body.classList.remove("no-scroll");
};

window.handleMainAction=()=>{
 if(open)openReviewModal();
 else window.open(`https://wa.me/${PHONE}?text=¿A qué hora abren?`,"_blank");
};

window.openReviewModal=()=>document.getElementById("review-modal").classList.add("active");
window.closeReviewModal=()=>document.getElementById("review-modal").classList.remove("active");

window.finalizeOrder=()=>{
 const name=document.getElementById("customer-name").value.trim();
 const notes=document.getElementById("special-notes").value.trim();
 if(!name)return alert("Nombre requerido");

 const extra=Math.max(0,pizza.ingredients.length-2)*EXTRA;
 const total=BASE+extra;

 push(ordersRef,{name,notes,pizza,total,time:Date.now(),status:"pending"});

 let msg=`Hola, soy *${name}*.\n🍕 Ingredientes: ${pizza.ingredients.join(", ")}\n`;
 if(pizza.dressings.length)msg+=`Aderezos: ${pizza.dressings.join(", ")}\n`;
 if(notes)msg+=`📝 ${notes}\n`;
 msg+=`TOTAL: $${total}`;

 window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`,"_blank");
 closeReviewModal();
};
</script>

</body>
</html>
